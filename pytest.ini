[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --color=yes --strict-markers --strict-config
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    data
    HOGENOM
    hogenom_bench
    test_trees_20
    test_trees_100
    test_trees_1000
    test_trees_10000
    test_trees_dtl01
    output_*
    wandb
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    gpu: marks tests requiring a CUDA GPU (deselect with '-m "not gpu"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests comparing with AleRax
    unit: marks unit tests for individual components
    kernel: marks low-level CUDA kernel tests under tests/kernels
