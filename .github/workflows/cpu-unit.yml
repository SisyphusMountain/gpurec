name: CPU Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run CPU unit gate
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q -m "unit and not gpu"

  rust-backtrack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup default stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python contract-test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Rust backtracking tests
        run: cargo test --locked --manifest-path crates/gpurec-backtrack/Cargo.toml

      - name: Smoke Rust backtracking CLI
        run: cargo run --locked --quiet --manifest-path crates/gpurec-backtrack/Cargo.toml -- --help

      - name: Run Rust backtracking fixture
        run: pytest -q tests/integration/test_rust_backtracking_fixture.py

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup default stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package, runtime, and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[release]"

      - name: Build source and wheel artifacts
        run: |
          rm -rf dist
          python -m build

      - name: Check artifact metadata
        run: python -m twine check dist/*

      - name: Check artifact package data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tarfile
          import zipfile

          required_wheel = []
          required_sdist = required_wheel + [
              "docs/README.md",
              "docs/lean-fast-path.md",
              "docs/optimization-workflow-call-graph.md",
              "docs/output-artifacts.md",
              "docs/production-optimization-guide.md",
              "docs/professionalization-audit-progress.tex",
              "docs/release-readiness.md",
              "docs/troubleshooting.md",
              "examples/README.md",
              "examples/minimal-run-config.json",
              "examples/specieswise-adagrad-restarts-config.json",
              "examples/tiny/families.txt",
              "examples/tiny/gene.map",
              "examples/tiny/gene.nwk",
              "examples/tiny/species.nwk",
              "crates/gpurec-backtrack/Cargo.toml",
              "crates/gpurec-backtrack/Cargo.lock",
              "crates/gpurec-backtrack/src/lib.rs",
              "crates/gpurec-backtrack/src/main.rs",
              "crates/gpurec-preprocess/Cargo.toml",
              "crates/gpurec-preprocess/Cargo.lock",
              "crates/gpurec-preprocess/src/lib.rs",
              "crates/gpurec-preprocess/src/main.rs",
          ]
          forbidden_sdist_prefixes = [
              "crates/gpurec-backtrack/target/",
              "crates/gpurec-preprocess/target/",
          ]
          forbidden_wheel_prefixes = [
              "crates/gpurec-backtrack/",
              "crates/gpurec-preprocess/",
              "examples/",
          ]
          forbidden_wheel_names = {
              "gpurec-backtrack",
              "gpurec-backtrack.exe",
          }

          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(sdists) != 1:
              raise SystemExit(f"expected one source archive, found {sdists}")
          with tarfile.open(sdists[0]) as archive:
              members = archive.getnames()
              names = {
                  name.split("/", 1)[1]
                  for name in members
                  if "/" in name
              }
              example_configs = [
                  "examples/minimal-run-config.json",
                  "examples/specieswise-adagrad-restarts-config.json",
              ]
              configs = []
              for example_config in example_configs:
                  config_member = next(
                      (
                          name
                          for name in members
                          if name.endswith(f"/{example_config}")
                      ),
                      None,
                  )
                  if config_member is None:
                      raise SystemExit(
                          f"sdist missing example config: {example_config}"
                      )
                  config_file = archive.extractfile(config_member)
                  if config_file is None:
                      raise SystemExit(f"could not read sdist member: {config_member}")
                  configs.append((example_config, json.load(config_file)))
          missing = [
              path
              for path in required_sdist
              if path not in names
          ]
          if missing:
              raise SystemExit(f"sdist missing required source files: {missing}")
          missing_example_targets = []
          for example_config, config in configs:
              for field in ("species_tree", "families_file"):
                  target = f"examples/{config[field]}"
                  if target not in names:
                      missing_example_targets.append(f"{example_config}: {target}")
          if missing_example_targets:
              raise SystemExit(
                  "example config targets missing from sdist: "
                  f"{missing_example_targets}"
              )
          forbidden = [
              prefix
              for prefix in forbidden_sdist_prefixes
              if any(name.startswith(prefix) for name in names)
          ]
          if forbidden:
              raise SystemExit(f"sdist includes forbidden paths: {forbidden}")

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          missing = [path for path in required_wheel if path not in names]
          if missing:
              raise SystemExit(f"wheel missing required package data: {missing}")
          forbidden = [
              prefix
              for prefix in forbidden_wheel_prefixes
              if any(name.startswith(prefix) for name in names)
          ]
          if forbidden:
              raise SystemExit(f"wheel includes forbidden paths: {forbidden}")
          forbidden_binaries = [
              name
              for name in names
              if Path(name).name in forbidden_wheel_names
          ]
          if forbidden_binaries:
              raise SystemExit(
                  "wheel includes Rust backtracking binaries: "
                  f"{forbidden_binaries}"
              )
          PY

      - name: Smoke source archive Rust crates and examples
        run: |
          sdist_unpack_dir=$(mktemp -d)
          export SDIST_UNPACK_DIR="$sdist_unpack_dir"
          python - <<'PY'
          from pathlib import Path
          import os
          import tarfile

          sdist = next(Path("dist").glob("*.tar.gz"))
          unpack_dir = Path(os.environ["SDIST_UNPACK_DIR"])
          with tarfile.open(sdist) as archive:
              archive.extractall(unpack_dir)
          print(next(unpack_dir.iterdir()))
          PY
          root=$(find "$sdist_unpack_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)
          cargo test --locked --manifest-path "$root/crates/gpurec-backtrack/Cargo.toml"
          cargo run --locked --quiet --manifest-path "$root/crates/gpurec-backtrack/Cargo.toml" -- --help
          cargo test --locked --manifest-path "$root/crates/gpurec-preprocess/Cargo.toml"
          cargo run --locked --quiet --manifest-path "$root/crates/gpurec-preprocess/Cargo.toml" -- --help
          cd "$root"
          python -m gpurec.cli validate-config --config examples/minimal-run-config.json --check-preprocess | tee genewise-validate.txt
          grep -q "optimizer=hessian-sgd" genewise-validate.txt
          grep -q "preprocess_checked=true" genewise-validate.txt
          python -m gpurec.cli validate-config --config examples/specieswise-adagrad-restarts-config.json --check-preprocess | tee specieswise-validate.txt
          grep -q "optimizer=adagrad-restarts" specieswise-validate.txt
          grep -q "preprocess_checked=true" specieswise-validate.txt

      - name: Install built wheel and smoke CLI
        run: |
          python -m pip uninstall -y gpurec
          python -m pip install --no-deps dist/*.whl
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          gpurec --help
          python -m gpurec.cli --help
          gpurec config-template --help
          gpurec config-template --mode genewise | tee genewise-config-template.json
          grep -q '"optimizer": "auto"' genewise-config-template.json
          grep -q '"mode": "genewise"' genewise-config-template.json
          gpurec config-template --mode specieswise | tee specieswise-config-template.json
          grep -q '"mode": "specieswise"' specieswise-config-template.json
          grep -q '"adagrad_restart_schedule": "8:1.0:60,16:0.5:35,32:0.5:30"' specieswise-config-template.json
          gpurec validate-config --help
          gpurec sample --help | tee sample-help.txt
          grep -q -- "--backtrack-binary" sample-help.txt
          grep -q -- "GPUREC_BACKTRACK_BIN" sample-help.txt
          grep -q -- "checkpoints/best.pt" sample-help.txt
          grep -q -- "checkpoints/latest.pt" sample-help.txt
          gpurec run --help | tee run-help.txt
          grep -q -- "--backtrack-binary" run-help.txt
          grep -q -- "GPUREC_BACKTRACK_BIN" run-help.txt
          gpurec backtrack-check --help | tee backtrack-check-help.txt
          grep -q -- "--backtrack-binary" backtrack-check-help.txt
          grep -q -- "GPUREC_BACKTRACK_BIN" backtrack-check-help.txt
          unset GPUREC_BACKTRACK_BIN
          set +e
          gpurec backtrack-check > backtrack-check.txt 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -q -- "--backtrack-binary" backtrack-check.txt
          grep -q -- "GPUREC_BACKTRACK_BIN" backtrack-check.txt
          python - <<'PY'
          import os
          from pathlib import Path
          import gpurec
          import gpurec.workflow as workflow

          package_path = Path(gpurec.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if package_path.is_relative_to(workspace):
              raise SystemExit(f"imported gpurec from checkout: {package_path}")
          if (
              "site-packages" not in package_path.parts
              and "dist-packages" not in package_path.parts
          ):
              raise SystemExit(
                  f"gpurec import is not from installed packages: {package_path}"
              )
          for name in gpurec.__all__:
              getattr(gpurec, name)
          if not set(gpurec.__all__) <= set(dir(gpurec)):
              raise SystemExit("top-level exports missing from dir(gpurec)")
          for name in workflow.__all__:
              workflow_value = getattr(workflow, name)
              if name not in gpurec.__all__:
                  raise SystemExit(
                      f"workflow export missing from gpurec.__all__: {name}"
                  )
              if getattr(gpurec, name) is not workflow_value:
                  raise SystemExit(f"top-level workflow export mismatch: {name}")
          if not set(workflow.__all__) <= set(dir(workflow)):
              raise SystemExit("workflow exports missing from dir(gpurec.workflow)")
          namespace = {}
          exec("from gpurec.workflow import *", namespace)
          exported = {name for name in namespace if not name.startswith("__")}
          if exported != set(workflow.__all__):
              raise SystemExit(
                  f"workflow wildcard mismatch: {sorted(exported ^ set(workflow.__all__))}"
              )
          print("exports_ok")
          PY
