name: CPU Unit Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run CPU unit gate
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q -m "unit and not gpu"

  rust-backtrack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup default stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python contract-test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Rust backtracking tests
        run: cargo test --locked --manifest-path crates/gpurec-backtrack/Cargo.toml

      - name: Smoke Rust backtracking CLI
        run: cargo run --locked --quiet --manifest-path crates/gpurec-backtrack/Cargo.toml -- --help

      - name: Run non-GPU integration gate
        run: pytest -q -m "integration and not gpu"

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package, runtime, and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[release]"

      - name: Build source and wheel artifacts
        run: |
          rm -rf dist
          python -m build

      - name: Check artifact metadata
        run: python -m twine check dist/*

      - name: Check artifact package data
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          required = [
              "gpurec/core/cpp/preprocess.cpp",
              "gpurec/core/cpp/clade_utils.cpp",
              "gpurec/core/cpp/clade_utils.hpp",
              "gpurec/core/cpp/tree_utils.cpp",
              "gpurec/core/cpp/tree_utils.hpp",
          ]

          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(sdists) != 1:
              raise SystemExit(f"expected one source archive, found {sdists}")
          with tarfile.open(sdists[0]) as archive:
              names = set(archive.getnames())
          missing = [
              path
              for path in required
              if not any(name.endswith("/" + path) for name in names)
          ]
          if missing:
              raise SystemExit(f"sdist missing required package data: {missing}")

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          missing = [path for path in required if path not in names]
          if missing:
              raise SystemExit(f"wheel missing required package data: {missing}")
          PY

      - name: Install built wheel and smoke CLI
        run: |
          python -m pip uninstall -y gpurec
          python -m pip install --no-deps dist/*.whl
          gpurec --help
          python -m gpurec.cli --help
