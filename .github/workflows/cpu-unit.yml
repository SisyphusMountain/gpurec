name: CPU Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run lint and type checks
        run: |
          python -m ruff check gpurec tests/unit
          python -m mypy --config-file=pyproject.toml --follow-imports=skip \
            gpurec/workflow/config.py \
            gpurec/workflow/_metadata.py \
            gpurec/workflow/checkpoint.py \
            gpurec/workflow/sampling.py \
            gpurec/workflow/_artifact_publish.py

      - name: Run CPU unit gate
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q -m "unit and not gpu"

  rust-backtrack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup default stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python contract-test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Rust backtracking tests
        run: cargo test --locked --manifest-path crates/gpurec-backtrack/Cargo.toml

      - name: Smoke Rust backtracking CLI
        run: cargo run --locked --quiet --manifest-path crates/gpurec-backtrack/Cargo.toml -- --help

      - name: Run Rust backtracking fixture
        run: pytest -q tests/integration/test_rust_backtracking_fixture.py

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup default stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package, runtime, and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[release]"

      - name: Build source and wheel artifacts
        run: |
          rm -rf dist
          python -m build

      - name: Generate dependency inventory and manifest
        run: |
          python scripts/generate_dependency_inventory.py \
            --output dist/dependency-inventory.json \
            --check-git-dependency-pins
          python - <<'PY'
          try:
            import tomllib  # type: ignore
          except ModuleNotFoundError:
            import tomli as tomllib  # type: ignore

          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          deps = project["project"]["dependencies"]
          Path("dist/python-dependencies.txt").write_text(
              "\n".join(sorted(deps)) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run dependency scans
        run: |
          python -m pip install pip-audit
          pip-audit -r dist/python-dependencies.txt | tee dist/pip-audit.txt || true
          if command -v cargo-audit >/dev/null 2>&1; then
            cargo-audit --file crates/gpurec-preprocess/Cargo.lock | tee dist/cargo-audit-preprocess.txt || true
            cargo-audit --file crates/gpurec-backtrack/Cargo.lock | tee dist/cargo-audit-backtrack.txt || true
          else
            echo "cargo-audit unavailable; skipping rust-audit scan" | tee dist/cargo-audit-skip.txt
          fi

      - name: Check artifact metadata
        run: python -m twine check dist/*

      - name: Check artifact package data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tarfile
          import zipfile

          required_wheel = []
          required_sdist = required_wheel + [
              "docs/README.md",
              "docs/input-preparation.md",
              "docs/lean-fast-path.md",
              "docs/optimization-workflow-call-graph.md",
              "docs/output-artifacts.md",
              "docs/production-optimization-guide.md",
              "docs/professionalization-audit-progress.tex",
              "docs/release-readiness.md",
              "docs/support-policy.md",
              "docs/troubleshooting.md",
              "examples/README.md",
              "examples/minimal-run-config.json",
              "examples/specieswise-adagrad-restarts-config.json",
              "examples/tiny/families.txt",
              "examples/tiny/gene.map",
              "examples/tiny/gene.nwk",
              "examples/tiny/species.nwk",
              "crates/gpurec-backtrack/Cargo.toml",
              "crates/gpurec-backtrack/Cargo.lock",
              "crates/gpurec-backtrack/src/lib.rs",
              "crates/gpurec-backtrack/src/main.rs",
              "crates/gpurec-preprocess/Cargo.toml",
              "crates/gpurec-preprocess/Cargo.lock",
              "crates/gpurec-preprocess/src/lib.rs",
              "crates/gpurec-preprocess/src/main.rs",
          ]
          forbidden_sdist_prefixes = [
              "crates/gpurec-backtrack/target/",
              "crates/gpurec-preprocess/target/",
          ]
          forbidden_wheel_prefixes = [
              "crates/gpurec-backtrack/",
              "crates/gpurec-preprocess/",
              "examples/",
          ]
          forbidden_wheel_names = {
              "gpurec-backtrack",
              "gpurec-backtrack.exe",
          }

          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(sdists) != 1:
              raise SystemExit(f"expected one source archive, found {sdists}")
          with tarfile.open(sdists[0]) as archive:
              members = archive.getnames()
              names = {
                  name.split("/", 1)[1]
                  for name in members
                  if "/" in name
              }
              example_configs = [
                  "examples/minimal-run-config.json",
                  "examples/specieswise-adagrad-restarts-config.json",
              ]
              configs = []
              for example_config in example_configs:
                  config_member = next(
                      (
                          name
                          for name in members
                          if name.endswith(f"/{example_config}")
                      ),
                      None,
                  )
                  if config_member is None:
                      raise SystemExit(
                          f"sdist missing example config: {example_config}"
                      )
                  config_file = archive.extractfile(config_member)
                  if config_file is None:
                      raise SystemExit(f"could not read sdist member: {config_member}")
                  configs.append((example_config, json.load(config_file)))
          missing = [
              path
              for path in required_sdist
              if path not in names
          ]
          if missing:
              raise SystemExit(f"sdist missing required source files: {missing}")
          missing_example_targets = []
          for example_config, config in configs:
              for field in ("species_tree", "families_file"):
                  target = f"examples/{config[field]}"
                  if target not in names:
                      missing_example_targets.append(f"{example_config}: {target}")
          if missing_example_targets:
              raise SystemExit(
                  "example config targets missing from sdist: "
                  f"{missing_example_targets}"
              )
          forbidden = [
              prefix
              for prefix in forbidden_sdist_prefixes
              if any(name.startswith(prefix) for name in names)
          ]
          if forbidden:
              raise SystemExit(f"sdist includes forbidden paths: {forbidden}")

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          missing = [path for path in required_wheel if path not in names]
          if missing:
              raise SystemExit(f"wheel missing required package data: {missing}")
          forbidden = [
              prefix
              for prefix in forbidden_wheel_prefixes
              if any(name.startswith(prefix) for name in names)
          ]
          if forbidden:
              raise SystemExit(f"wheel includes forbidden paths: {forbidden}")
          forbidden_binaries = [
              name
              for name in names
              if Path(name).name in forbidden_wheel_names
          ]
          if forbidden_binaries:
              raise SystemExit(
                  "wheel includes Rust backtracking binaries: "
                  f"{forbidden_binaries}"
              )
          PY

      - name: Smoke source archive Rust crates and examples
        run: |
          sdist_unpack_dir=$(mktemp -d)
          export SDIST_UNPACK_DIR="$sdist_unpack_dir"
          python - <<'PY'
          from pathlib import Path
          import os
          import tarfile

          sdist = next(Path("dist").glob("*.tar.gz"))
          unpack_dir = Path(os.environ["SDIST_UNPACK_DIR"])
          with tarfile.open(sdist) as archive:
              archive.extractall(unpack_dir)
          print(next(unpack_dir.iterdir()))
          PY
          root=$(find "$sdist_unpack_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)
          cargo test --locked --manifest-path "$root/crates/gpurec-backtrack/Cargo.toml"
          cargo run --locked --quiet --manifest-path "$root/crates/gpurec-backtrack/Cargo.toml" -- --help
          cargo test --locked --manifest-path "$root/crates/gpurec-preprocess/Cargo.toml"
          cargo run --locked --quiet --manifest-path "$root/crates/gpurec-preprocess/Cargo.toml" -- --help
          cd "$root"
          python -m gpurec.cli validate-config --config examples/minimal-run-config.json --require-mode-default-optimizer --require-production-default-route --check-preprocess | tee genewise-validate.txt
          grep -q "optimizer=hessian-sgd" genewise-validate.txt
          grep -q "uses_mode_default_optimizer=true" genewise-validate.txt
          grep -q "uses_production_default_route=true" genewise-validate.txt
          grep -q "production_default_route_mismatches=none" genewise-validate.txt
          grep -q "hessian_sgd_normal_fixed_iters_pi=full" genewise-validate.txt
          grep -q "hessian_sgd_pi_adjoint_warmstart=false" genewise-validate.txt
          grep -q "pi_fixed_point_relaxation=1.000000" genewise-validate.txt
          grep -q "hessian_sgd_validation_interval=0" genewise-validate.txt
          grep -q "hessian_sgd_validation_fixed_iters_pi=configured" genewise-validate.txt
          grep -q "hessian_sgd_validation_neumann_terms=configured" genewise-validate.txt
          grep -q "cuda_backward_ready=false" genewise-validate.txt
          grep -q "preprocess_checked=true" genewise-validate.txt
          set +e
          python -m gpurec.cli validate-config --config examples/minimal-run-config.json --require-mode-default-optimizer --require-production-default-route --check-preprocess --require-cuda-backward-ready > genewise-cuda-ready.out 2> genewise-cuda-ready.err
          genewise_example_cuda_status=$?
          set -e
          test "$genewise_example_cuda_status" -eq 2
          grep -q "cuda_backward_ready=false cuda_backward_ready_reason=requires_s_gt_256" genewise-cuda-ready.err
          test ! -s genewise-cuda-ready.out
          python -m gpurec.cli validate-config --config examples/specieswise-adagrad-restarts-config.json --require-mode-default-optimizer --require-production-default-route --check-preprocess | tee specieswise-validate.txt
          grep -q "optimizer=adagrad-restarts" specieswise-validate.txt
          grep -q "uses_mode_default_optimizer=true" specieswise-validate.txt
          grep -q "uses_production_default_route=true" specieswise-validate.txt
          grep -q "production_default_route_mismatches=none" specieswise-validate.txt
          grep -q "adagrad_restart_schedule=8:1:60,16:0.5:35,32:0.5:30" specieswise-validate.txt
          grep -q "adagrad_restart_total_steps=125" specieswise-validate.txt
          grep -q "optimizer_step_cap=125" specieswise-validate.txt
          grep -q "optimizer_step_cap_reason=adagrad_restart_schedule" specieswise-validate.txt
          grep -q "cuda_backward_ready=false" specieswise-validate.txt
          grep -q "preprocess_checked=true" specieswise-validate.txt
          set +e
          python -m gpurec.cli validate-config --config examples/specieswise-adagrad-restarts-config.json --require-mode-default-optimizer --require-production-default-route --check-preprocess --require-cuda-backward-ready > specieswise-cuda-ready.out 2> specieswise-cuda-ready.err
          specieswise_example_cuda_status=$?
          set -e
          test "$specieswise_example_cuda_status" -eq 2
          grep -q "cuda_backward_ready=false cuda_backward_ready_reason=requires_s_gt_256" specieswise-cuda-ready.err
          test ! -s specieswise-cuda-ready.out

      - name: Install source archive in fresh venv and run doctor
        run: |
          python -m venv sdist-smoke-venv
          . sdist-smoke-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          gpurec doctor --json | tee sdist-doctor.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("sdist-doctor.json").read_text(encoding="utf-8"))
          required = {"python", "torch", "triton", "preprocess", "backtracking", "out_dir"}
          missing = required - set(report.get("checks", {}).keys())
          if missing:
              raise SystemExit(f"doctor report missing checks: {sorted(missing)}")
          if not report.get("checks", {}).get("python", {}).get("ok", False):
              raise SystemExit("doctor python check is not ok")
          PY

      - name: Install built wheel and smoke CLI
        run: |
          python -m pip uninstall -y gpurec
          python -m pip install --no-deps dist/*.whl
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          gpurec --help
          python -m gpurec.cli --help
          gpurec preprocess-check --help | tee preprocess-check-help.txt
          grep -q -- "--preprocess-native-lib" preprocess-check-help.txt
          grep -q -- "GPUREC_PREPROCESS_NATIVE_LIB" preprocess-check-help.txt
          unset GPUREC_PREPROCESS_NATIVE_LIB
          set +e
          gpurec preprocess-check > preprocess-check-missing.txt 2>&1
          preprocess_check_status=$?
          set -e
          test "$preprocess_check_status" -eq 1
          grep -q -- "GPUREC_PREPROCESS_NATIVE_LIB" preprocess-check-missing.txt
          grep -q -- "--preprocess-native-lib" preprocess-check-missing.txt
          gpurec config-template --help | tee config-template-help.txt
          grep -q -- "mode-default Adam" config-template-help.txt
          gpurec config-template --mode genewise | tee genewise-config-template.json
          grep -q '"optimizer": "auto"' genewise-config-template.json
          grep -q '"mode": "genewise"' genewise-config-template.json
          grep -q '"solver_warmup_iters": 4' genewise-config-template.json
          grep -q '"hessian_sgd_normal_fixed_iters_pi": null' genewise-config-template.json
          grep -q '"hessian_sgd_pi_adjoint_warmstart": false' genewise-config-template.json
          grep -q '"pi_fixed_point_relaxation": 1.0' genewise-config-template.json
          grep -q '"hessian_sgd_validation_interval": 0' genewise-config-template.json
          grep -q '"hessian_sgd_validation_fixed_iters_pi": null' genewise-config-template.json
          grep -q '"hessian_sgd_validation_neumann_terms": null' genewise-config-template.json
          gpurec config-template --mode specieswise | tee specieswise-config-template.json
          grep -q '"mode": "specieswise"' specieswise-config-template.json
          grep -q '"adagrad_restart_schedule": "8:1.0:60,16:0.5:35,32:0.5:30"' specieswise-config-template.json
          grep -q '"adagrad_restart_final_check_iters": 128' specieswise-config-template.json
          gpurec config-template --mode global | tee global-config-template.json
          grep -q '"optimizer": "auto"' global-config-template.json
          grep -q '"mode": "global"' global-config-template.json
          cargo build --release --locked --features python-extension --manifest-path "$GITHUB_WORKSPACE/crates/gpurec-preprocess/Cargo.toml"
          export GPUREC_PREPROCESS_NATIVE_LIB="$GITHUB_WORKSPACE/crates/gpurec-preprocess/target/release/libgpurec_preprocess.so"
          gpurec preprocess-check | tee preprocess-check.txt
          grep -q "preprocessing_available=true" preprocess-check.txt
          grep -q "preprocess_native_lib=" preprocess-check.txt
          gpurec config-template --mode genewise --species-tree "$GITHUB_WORKSPACE/examples/tiny/species.nwk" --families-file "$GITHUB_WORKSPACE/examples/tiny/families.txt" --out-dir "$smoke_dir/generated-genewise-out" --output generated-genewise-run.json
          gpurec validate-config --config generated-genewise-run.json --require-mode-default-optimizer --require-production-default-route --check-preprocess | tee generated-genewise-validate.txt
          grep -q "optimizer=hessian-sgd" generated-genewise-validate.txt
          grep -q "uses_mode_default_optimizer=true" generated-genewise-validate.txt
          grep -q "uses_production_default_route=true" generated-genewise-validate.txt
          grep -q "production_default_route_mismatches=none" generated-genewise-validate.txt
          grep -q "cuda_backward_ready=false" generated-genewise-validate.txt
          grep -q "preprocess_checked=true" generated-genewise-validate.txt
          set +e
          gpurec validate-config --config generated-genewise-run.json --require-mode-default-optimizer --require-production-default-route --check-preprocess --require-cuda-backward-ready > generated-genewise-cuda-ready.out 2> generated-genewise-cuda-ready.err
          genewise_cuda_status=$?
          set -e
          test "$genewise_cuda_status" -eq 2
          grep -q "cuda_backward_ready=false cuda_backward_ready_reason=requires_s_gt_256" generated-genewise-cuda-ready.err
          test ! -s generated-genewise-cuda-ready.out
          gpurec config-template --mode specieswise --species-tree "$GITHUB_WORKSPACE/examples/tiny/species.nwk" --families-file "$GITHUB_WORKSPACE/examples/tiny/families.txt" --out-dir "$smoke_dir/generated-specieswise-out" --output generated-specieswise-run.json
          gpurec validate-config --config generated-specieswise-run.json --require-mode-default-optimizer --require-production-default-route --check-preprocess | tee generated-specieswise-validate.txt
          grep -q "optimizer=adagrad-restarts" generated-specieswise-validate.txt
          grep -q "uses_mode_default_optimizer=true" generated-specieswise-validate.txt
          grep -q "uses_production_default_route=true" generated-specieswise-validate.txt
          grep -q "production_default_route_mismatches=none" generated-specieswise-validate.txt
          grep -q "cuda_backward_ready=false" generated-specieswise-validate.txt
          grep -q "preprocess_checked=true" generated-specieswise-validate.txt
          set +e
          gpurec validate-config --config generated-specieswise-run.json --require-mode-default-optimizer --require-production-default-route --check-preprocess --require-cuda-backward-ready > generated-specieswise-cuda-ready.out 2> generated-specieswise-cuda-ready.err
          specieswise_cuda_status=$?
          set -e
          test "$specieswise_cuda_status" -eq 2
          grep -q "cuda_backward_ready=false cuda_backward_ready_reason=requires_s_gt_256" generated-specieswise-cuda-ready.err
          test ! -s generated-specieswise-cuda-ready.out
          gpurec config-template --mode global --species-tree "$GITHUB_WORKSPACE/examples/tiny/species.nwk" --families-file "$GITHUB_WORKSPACE/examples/tiny/families.txt" --out-dir "$smoke_dir/generated-global-out" --output generated-global-run.json
          gpurec validate-config --config generated-global-run.json --require-mode-default-optimizer | tee generated-global-mode-default-validate.txt
          grep -q "optimizer=adam" generated-global-mode-default-validate.txt
          grep -q "uses_mode_default_optimizer=true" generated-global-mode-default-validate.txt
          grep -q "uses_production_default_route=false" generated-global-mode-default-validate.txt
          grep -q "production_default_route_mismatches=mode" generated-global-mode-default-validate.txt
          set +e
          gpurec validate-config --config generated-global-run.json --require-production-default-route > generated-global-production-route.out 2> generated-global-production-route.err
          global_status=$?
          set -e
          test "$global_status" -eq 2
          grep -q "config production default route fields differ for mode 'global': mode" generated-global-production-route.err
          test ! -s generated-global-production-route.out
          gpurec optimize --help | tee optimize-help.txt
          grep -q -- "--require-converged" optimize-help.txt
          grep -q -- "--require-final-check-ok" optimize-help.txt
          grep -q -- "--require-mode-default-optimizer" optimize-help.txt
          grep -q -- "--require-production-default-route" optimize-help.txt
          grep -q -- "likelihood/gradient route" optimize-help.txt
          grep -q -- "rate parameterization" optimize-help.txt
          grep -q -- "optimizer route" optimize-help.txt
          gpurec validate-config --help | tee validate-config-help.txt
          grep -q -- "--require-cuda-backward-ready" validate-config-help.txt
          grep -q -- "--require-mode-default-optimizer" validate-config-help.txt
          grep -q -- "--require-production-default-route" validate-config-help.txt
          gpurec summary-info --help | tee summary-info-help.txt
          grep -q -- "--summary" summary-info-help.txt
          grep -q -- "--require-converged" summary-info-help.txt
          grep -q -- "--require-final-check-ok" summary-info-help.txt
          grep -q -- "--require-mode-default-optimizer" summary-info-help.txt
          grep -q -- "--require-production-default-route" summary-info-help.txt
          grep -q -- "summary.json" summary-info-help.txt
          gpurec checkpoint-info --help | tee checkpoint-info-help.txt
          grep -q -- "--checkpoint" checkpoint-info-help.txt
          grep -q -- "--require-final-check-ok" checkpoint-info-help.txt
          grep -q -- "--require-mode-default-optimizer" checkpoint-info-help.txt
          grep -q -- "--require-production-default-route" checkpoint-info-help.txt
          grep -q -- "checkpoint" checkpoint-info-help.txt
          gpurec sample --help | tee sample-help.txt
          grep -q -- "--backtrack-binary" sample-help.txt
          grep -q -- "--require-mode-default-optimizer" sample-help.txt
          grep -q -- "--require-production-default-route" sample-help.txt
          grep -q -- "GPUREC_BACKTRACK_BIN" sample-help.txt
          grep -q -- "checkpoints/best.pt" sample-help.txt
          grep -q -- "checkpoints/latest.pt" sample-help.txt
          gpurec run --help | tee run-help.txt
          grep -q -- "--require-converged" run-help.txt
          grep -q -- "--require-final-check-ok" run-help.txt
          grep -q -- "--require-mode-default-optimizer" run-help.txt
          grep -q -- "--require-production-default-route" run-help.txt
          grep -q -- "--backtrack-binary" run-help.txt
          grep -q -- "GPUREC_BACKTRACK_BIN" run-help.txt
          gpurec backtrack-check --help | tee backtrack-check-help.txt
          grep -q -- "--backtrack-binary" backtrack-check-help.txt
          grep -q -- "GPUREC_BACKTRACK_BIN" backtrack-check-help.txt
          unset GPUREC_BACKTRACK_BIN
          set +e
          gpurec backtrack-check > backtrack-check.txt 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -q -- "--backtrack-binary" backtrack-check.txt
          grep -q -- "GPUREC_BACKTRACK_BIN" backtrack-check.txt
          python - <<'PY'
          import os
          from pathlib import Path
          import gpurec
          import gpurec.workflow as workflow

          package_path = Path(gpurec.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if package_path.is_relative_to(workspace):
              raise SystemExit(f"imported gpurec from checkout: {package_path}")
          if (
              "site-packages" not in package_path.parts
              and "dist-packages" not in package_path.parts
          ):
              raise SystemExit(
                  f"gpurec import is not from installed packages: {package_path}"
              )
          for name in gpurec.__all__:
              getattr(gpurec, name)
          if not set(gpurec.__all__) <= set(dir(gpurec)):
              raise SystemExit("top-level exports missing from dir(gpurec)")
          for name in workflow.__all__:
              workflow_value = getattr(workflow, name)
              if name not in gpurec.__all__:
                  raise SystemExit(
                      f"workflow export missing from gpurec.__all__: {name}"
                  )
              if getattr(gpurec, name) is not workflow_value:
                  raise SystemExit(f"top-level workflow export mismatch: {name}")
          if not set(workflow.__all__) <= set(dir(workflow)):
              raise SystemExit("workflow exports missing from dir(gpurec.workflow)")
          namespace = {}
          exec("from gpurec.workflow import *", namespace)
          exported = {name for name in namespace if not name.startswith("__")}
          if exported != set(workflow.__all__):
              raise SystemExit(
                  f"workflow wildcard mismatch: {sorted(exported ^ set(workflow.__all__))}"
              )
          print("exports_ok")
          PY
