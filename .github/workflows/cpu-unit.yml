name: CPU Unit Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run CPU unit gate
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q -m "unit and not gpu"

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package, runtime, and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[release]"

      - name: Build source and wheel artifacts
        run: |
          rm -rf dist
          python -m build

      - name: Check artifact metadata
        run: python -m twine check dist/*

      - name: Install built wheel and smoke CLI
        run: |
          python -m pip uninstall -y gpurec
          python -m pip install --no-deps dist/*.whl
          python -m gpurec.cli --help
