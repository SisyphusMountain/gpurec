name: GPU Validation

on:
  pull_request:
  push:
    branches:
      - main
      - production
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-path:
    name: Production CUDA path smoke
    runs-on: [self-hosted, Linux, GPU]
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Rust
        run: rustup default stable

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Detect CUDA runtime availability
        id: cuda-check
        run: |
          python - <<'PY'
          import os
          import torch

          skip = "1" if not torch.cuda.is_available() else "0"
          print("No CUDA runtime available; skipping GPU smoke.") if skip == "1" else print(
              "CUDA runtime detected; running GPU smoke."
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={skip}\n")
          PY

      - name: Fail required GPU gate when CUDA is unavailable
        if: steps.cuda-check.outputs.skip == '1' && github.event_name != 'schedule'
        run: |
          echo "GPU validation is required for pull_request/push events."
          echo "This runner did not expose a CUDA runtime."
          exit 1

      - name: Build preprocessing extension for config smoke
        if: steps.cuda-check.outputs.skip != '1'
        run: |
          cargo build --release --locked --features python-extension --manifest-path "$GITHUB_WORKSPACE/crates/gpurec-preprocess/Cargo.toml"
          echo "GPUREC_PREPROCESS_NATIVE_LIB=$GITHUB_WORKSPACE/crates/gpurec-preprocess/target/release/libgpurec_preprocess.so" >> "$GITHUB_ENV"

      - name: Verify preprocessing native artifact readiness
        if: steps.cuda-check.outputs.skip != '1'
        run: |
          gpurec preprocess-check \
            --preprocess-native-lib "$GPUREC_PREPROCESS_NATIVE_LIB"

      - name: CUDA smoke suite
        if: steps.cuda-check.outputs.skip != '1'
        run: |
          set -e
          python -m pytest -q tests/integration/test_gene_recon_model.py::test_gene_recon_model_forward_backward_modes
          python -m pytest -q tests/integration/test_uniform_chunked_model.py::test_chunked_uniform_from_folder_and_adam_step

      - name: Validate realistic CUDA fixture and run one optimization step
        if: steps.cuda-check.outputs.skip != '1'
        env:
          GPUREC_PREPROCESS_NATIVE_LIB: ${{ env.GPUREC_PREPROCESS_NATIVE_LIB }}
        run: |
          set -e
          smoke_out=$(mktemp -d)
          echo "SMOKE_OUT=$smoke_out" >> "$GITHUB_ENV"
          config=$smoke_out/genuine-cuda-smoke.json
          gpurec config-template \
            --mode genewise \
            --species-tree "$GITHUB_WORKSPACE/tests/data/test_trees_1000/sp.nwk" \
            --families-file "$GITHUB_WORKSPACE/tests/data/test_trees_1000/families.txt" \
            --out-dir "$smoke_out" \
            --output "$config"
          gpurec validate-config --config "$config" \
            --require-mode-default-optimizer \
            --require-production-default-route \
            --check-preprocess \
            --require-cuda-backward-ready \
            --preprocess-native-lib "$GITHUB_WORKSPACE/crates/gpurec-preprocess/target/release/libgpurec_preprocess.so"
          gpurec optimize --config "$config" \
            --out-dir "$smoke_out/opt" \
            --max-families 3 \
            --max-iters-e 4 \
            --max-wave-size 32768 \
            --neumann-terms 4 \
            --steps 1 \
            --require-mode-default-optimizer \
            --require-production-default-route \
            --checkpoint-every 1
          gpurec summary-info --summary "$smoke_out/opt/summary.json" --require-mode-default-optimizer
          gpurec checkpoint-info --checkpoint "$smoke_out/opt/checkpoints/latest.pt" --require-final-check-ok

      - name: Validate CUDA smoke artifacts
        if: steps.cuda-check.outputs.skip != '1'
        run: |
          set -e
          python scripts/validate_output_artifacts.py \
            --summary "$smoke_out/opt/summary.json" \
            --history "$smoke_out/opt/history.jsonl" \
            --checkpoint "$smoke_out/opt/checkpoints/latest.pt" \
            --run-manifest "$smoke_out/opt/run_manifest.json" \
            --tsv "$smoke_out/opt/rates_final.tsv" \
            --tsv "$smoke_out/opt/per_fam_likelihoods.tsv"

      - name: Enforce CUDA smoke thresholds
        if: steps.cuda-check.outputs.skip != '1'
        env:
          GPUREC_GPU_SMOKE_MAX_ELAPSED_S: "3600"
          GPUREC_GPU_SMOKE_MAX_FINAL_NLL_BITS: "1000000000"
        run: |
          set -e
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          smoke_out = os.environ["SMOKE_OUT"]
          summary = json.loads(Path(smoke_out + "/opt/summary.json").read_text(encoding="utf-8"))
          history_rows = [
              json.loads(line)
              for line in Path(smoke_out + "/opt/history.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if not history_rows:
              raise SystemExit("history.jsonl is empty")

          elapsed = summary.get("elapsed_s")
          if elapsed is None or not isinstance(elapsed, (int, float)) or not math.isfinite(float(elapsed)):
              raise SystemExit(f"summary elapsed_s is invalid: {elapsed!r}")
          max_elapsed = float(os.environ["GPUREC_GPU_SMOKE_MAX_ELAPSED_S"])
          if float(elapsed) > max_elapsed:
              raise SystemExit(f"summary elapsed_s {elapsed} exceeds threshold {max_elapsed}")

          final_nll_bits = summary.get("final_nll_bits")
          if final_nll_bits is None or not isinstance(final_nll_bits, (int, float)) or not math.isfinite(float(final_nll_bits)):
              raise SystemExit(f"summary final_nll_bits is invalid: {final_nll_bits!r}")
          max_abs_nll = float(os.environ["GPUREC_GPU_SMOKE_MAX_FINAL_NLL_BITS"])
          if abs(float(final_nll_bits)) > max_abs_nll:
              raise SystemExit(
                  f"summary final_nll_bits {final_nll_bits} exceeds absolute threshold {max_abs_nll}"
              )

          final_grad_inf = summary.get("final_grad_inf")
          if final_grad_inf is not None and (
              not isinstance(final_grad_inf, (int, float)) or not math.isfinite(float(final_grad_inf))
          ):
              raise SystemExit(f"summary final_grad_inf is invalid: {final_grad_inf!r}")
          PY
