[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpurec"
version = "0.1.0"
description = "GPU-accelerated gene tree / species tree reconciliation using the DTL model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "triton>=2.1",
]

[project.scripts]
gpurec = "gpurec.cli:main"

[project.optional-dependencies]
hogenom = [
    "hydra-core",
    "matplotlib",
    "numpy",
    "omegaconf",
    "pandas",
    "wandb",
]
dev = ["pytest", "ipython"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gpurec*"]

[tool.setuptools.package-data]
"gpurec.core" = ["cpp/*.cpp", "cpp/*.hpp"]
