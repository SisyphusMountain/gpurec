[build-system]
requires = ["setuptools>=68.0", "setuptools-rust>=1.8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpurec"
version = "0.1.0"
description = "GPU-accelerated gene tree / species tree reconciliation using the DTL model"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "triton>=2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gpurec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
