[build-system]
requires = ["setuptools>=68.0", "setuptools-rust>=1.8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpurec"
version = "0.1.0"
description = "GPU-accelerated gene tree / species tree reconciliation using the DTL model"
requires-python = ">=3.10,<3.13"
# Pinned 2026-06-28 to the verified modern stack: torch 2.11.0 (cu130) + triton 3.6.0,
# Python 3.12, CUDA 13.0. Triton kernels verified under 3.6 (34/38 tests pass; the 4
# failures are a stale golden fixture, unrelated to these versions). See CONSOLIDATION_PLAN.md.
dependencies = [
    "numpy>=1.24",
    "torch>=2.11",
    "triton>=3.6",
]

# Extra deps for the experiment drivers (not needed by the core library):
#   experiments/receiver_robustness/archaea_exposure_cv.py -> ete3 (needs six), scipy
[project.optional-dependencies]
experiments = ["scipy", "ete3", "six"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gpurec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA + Triton (deselect with -m 'not gpu')",
    "slow: long-running test",
]
