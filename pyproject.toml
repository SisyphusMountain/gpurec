[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpurec"
version = "0.1.0"
description = "GPU-accelerated gene tree / species tree reconciliation using the DTL model"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "SisyphusMountain" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch>=2.0",
    "triton>=2.1",
]

[project.urls]
Repository = "https://github.com/SisyphusMountain/gpurec"
Issues = "https://github.com/SisyphusMountain/gpurec/issues"
Documentation = "https://github.com/SisyphusMountain/gpurec#readme"

[project.scripts]
gpurec = "gpurec.cli:main"

[project.optional-dependencies]
hogenom = [
    "hydra-core",
    "matplotlib",
    "numpy",
    "omegaconf",
    "pandas",
    "wandb",
]
dev = [
    "pytest",
    "ipython",
    "PyYAML",
    "ruff",
    "mypy",
    "tomli; python_version < '3.11'",
]
release = ["build", "twine"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gpurec*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
show_error_codes = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
follow_imports = "normal"
