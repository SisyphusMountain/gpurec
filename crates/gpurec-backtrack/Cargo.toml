[package]
name = "gpurec-backtrack"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python-extension = ["numpy", "pyo3"]

[dependencies]
numpy = { version = "0.22", optional = true }
pyo3 = { version = "0.22", features = ["abi3-py310", "extension-module"], optional = true }
rand = "0.8"
rayon = "1"
flate2 = "1"
rustree = { git = "https://github.com/SisyphusMountain/rustree.git", rev = "e3a58478f0e57c80af04c730acade639d8e9015e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
